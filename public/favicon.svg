<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VuelaLatino">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a63e6"/>
      <stop offset="1" stop-color="#0c2a6e"/>
    </linearGradient>
    <linearGradient id="vl-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#ff7a26"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#vl-bg)"/>
  <!-- sol en el horizonte -->
  <circle cx="22" cy="44" r="12" fill="url(#vl-sun)" opacity=".95"/>
  <rect x="6" y="44" width="52" height="14" fill="url(#vl-bg)"/>
  <path d="M8 44.5h48" stroke="#ffd0ad" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <!-- ruta punteada -->
  <path d="M12 52 C 22 50, 30 44, 34 36" fill="none" stroke="#ffd0ad" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 5"/>
  <!-- avión de papel -->
  <path d="M55 11 L19 27 L32 31.5 Z" fill="#ffffff"/>
  <path d="M55 11 L32 31.5 L38 45 Z" fill="#cfdcff"/>
  <path d="M32 31.5 L31 39 L35.5 34.6 Z" fill="#9fb6f2"/>
</svg>
